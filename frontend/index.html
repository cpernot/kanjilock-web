<script type="module">
    import { setBoxContext, resetBoxContext, initEngine } from "/static/js/quizengine.js";
    import { navigate } from "/static/js/spa.js";
    import { saveSettings, getSettings } from "/static/js/settings.js";
    const USER_ID = localStorage.getItem('kanji_player') || 'Anonymous';
    
    async function setupBoxSelection() {
    const select = document.getElementById("box-select");
    select.innerHTML = ""; 

    // 1. Add Default Options
    select.add(new Option("Global (All Kanjis)", ""));
    select.add(new Option("🎲 Random Box Challenge", "random"));

    try {
        // 2. Fetch Levels and Available Boxes simultaneously
        const [lvlRes, boxRes] = await Promise.all([
            fetch(`/api/box-progress/${USER_ID}`),
            fetch(`/api/available-boxes`)
        ]);

        const levels = lvlRes.ok ? await lvlRes.json() : {};
        const availableBoxes = boxRes.ok ? await boxRes.json() : [];

        // 3. Generate options based on what's ACTUALLY in the database
        availableBoxes.forEach(boxName => {
            const lvl = levels[boxName] || 0;
            const star = lvl === 4 ? "⭐ " : "";
            const opt = new Option(`${star}Box ${boxName} (Niv. ${lvl})`, boxName);
            
            if (lvl === 4) opt.style.color = "gold";
            select.add(opt);
        });

    } catch (e) {
        console.error("Initialization error:", e);
    }
}

    // Initialize UI on load
    window.addEventListener('load', setupBoxSelection);

    document.getElementById("btn-start-box").onclick = () => {
        let boxId = document.getElementById("box-select").value;
        
        // Request ②: Handle Random Box
        if (boxId === "random") {
            boxId = Math.floor(Math.random() * 150) + 1;
            alert(`Random Challenge: Box ${boxId}!`);
        }

        setBoxContext(boxId);
        
        const s = getSettings();
        s.sessionSize = 14;
        saveSettings(s);

        window.location.hash = "#autostart";
        navigate("/quiz-page");
    };
</script>
<script>
    const btn = document.getElementById('chat-toggle');
    const box = document.getElementById('chat-box');
    btn.onclick = () => box.style.display = box.style.display === 'none' ? 'block' : 'none';

    document.getElementById('chat-send').onclick = async () => {
        const input = document.getElementById('chat-input');
        const history = document.getElementById('chat-history');
        const text = input.value;
        input.value = '';

        history.innerHTML += `<div><b>Vous:</b> ${text}</div>`;
        
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: text, player: localStorage.getItem('kanji_player') || 'Anonymous' })
        });
        const data = await res.json();
        history.innerHTML += `<div><b>Sensei:</b> ${data.reply}</div>`;
        history.scrollTop = history.scrollHeight;
    };
</script>
