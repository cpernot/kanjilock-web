<script type="module">
    import { setBoxContext, resetBoxContext, initEngine } from "/static/js/quizengine.js";
    import { navigate } from "/static/js/spa.js";
    import { saveSettings, getSettings } from "/static/js/settings.js";
    const USER_ID = localStorage.getItem("kanjilock_player") || 'Anonymous';
    console.log("YOU ARE:", USER_ID);

   async function checkChatAvailability() {
    const chatToggle = document.getElementById('chat-toggle');
    const chatContainer = document.getElementById('chat-container');

    try {
        const res = await fetch('/'); // 先ほど main.py で作ったルートを確認
        const data = await res.json();

        if (data.chat_enabled === false) {
            // チャットが無効ならボタンを非表示にする
            chatContainer.style.display = 'none';
            console.log("ℹ️ Chat is disabled on server to save memory.");
        }
    } catch (e) {
        console.error("Chat check failed", e);
    }
}

// ページロード時に実行
window.addEventListener('load', () => {
    setupBoxSelection();
    checkChatAvailability(); // これを追加
}); 

async function setupBoxSelection() {
    // 要素が出るまで最大2秒間、少し待機する（SPAの読み込み対策）
    let select = document.getElementById("box-select");
    if (!select) {
        await new Promise(resolve => setTimeout(resolve, 100)); // 0.1秒待つ
        select = document.getElementById("box-select");
    }
    
    if (!select) return; // それでもなければ諦める
    
    console.log("📦 Setting up Box Selection...");
    select.innerHTML = ""; 

    // デフォルトの選択肢を追加
    select.add(new Option("Global (All Kanjis)", ""));
    select.add(new Option("🎲 Random Box Challenge", "random"));

    try {
        const player = localStorage.getItem("kanji_player") || 'Anonymous';
        const [lvlRes, boxRes] = await Promise.all([
            fetch(`/api/box-progress/${encodeURIComponent(player)}`),
            fetch(`/api/available-boxes`)
        ]);
        
        if (!lvlRes.ok || !boxRes.ok) return;

        const levels = await lvlRes.json();
        const availableBoxes = await boxRes.json();

        availableBoxes.forEach(boxName => {
            const lvl = levels[boxName]?.qa || 0;
            const star = lvl === 4 ? "⭐ " : "";
            select.add(new Option(`${star}Box ${boxName} (Niv. ${lvl})`, boxName));
        });
    } catch (e) {
        console.error("❌ Error loading boxes:", e);
    }
}

// ページ遷移（ナビゲーション）を監視して、クイズページに来たら実行する
window.addEventListener('hashchange', () => {
    if (window.location.hash.includes('quiz')) {
        setTimeout(setupBoxSelection, 100); // 画面が描画されるのを少し待って実行
    }
});

// 初回読み込み時にも実行
window.addEventListener('load', setupBoxSelection);

    document.getElementById("btn-start-box").onclick = () => {
        let boxId = document.getElementById("box-select").value;
        
        // Request ②: Handle Random Box
        if (boxId === "random") {
            boxId = Math.floor(Math.random() * 150) + 1;
            alert(`Random Challenge: Box ${boxId}!`);
        }

        setBoxContext(boxId);
        
        const s = getSettings();
        s.sessionSize = 14;
        saveSettings(s);

        window.location.hash = "#autostart";
        navigate("/quiz-page");
    };
</script>
<script>
    const btn = document.getElementById('chat-toggle');
    const box = document.getElementById('chat-box');
    btn.onclick = () => box.style.display = box.style.display === 'none' ? 'block' : 'none';

    document.getElementById('chat-send').onclick = async () => {
    const input = document.getElementById('chat-input');
    const history = document.getElementById('chat-history');
    const text = input.value;
    if (!text) return;

    input.value = '';
    history.innerHTML += `<div><b>Vous:</b> ${text}</div>`;
    
    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: text, player: localStorage.getItem('kanji_player') || 'Anonymous' })
        });

        // サーバー側でインポートエラーなどで落ちている、または無効な場合
        if (res.status === 404 || !res.ok) {
            throw new Error("Chat unavailable");
        }

        const data = await res.json();
        history.innerHTML += `<div><b>Gemini:</b> ${data.response}</div>`;
    } catch (err) {
        // エラー時のメッセージ表示
        history.innerHTML += `<div style="color: grey; font-size: 0.8em;"><i>Désolé, le chat est temporairement désactivé pour économiser de la mémoire sur Render.</i></div>`;
    }
    history.scrollTop = history.scrollHeight;
};
</script>
