<head>
  <meta charset="utf-8">
  <title>Multi_Quiz_KanjiLock</title>

  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>


  <main>
    <h1>🧩 Quiz</h1>
   
    <div id="controls">
    <select id="modeSelect">
      <option value="qa">Kanji → Sens</option>
      <option value="qb">Sens → Kanji</option>
      <option value="qc">Mot → Sens</option>
      <option value="qd">Kanji → Boite</option>
      <option value="qe">Kanji → Romaji</option>
    </select>
      <button id="startBtn">▶️ Start</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>
     <div class="time-bar">
         <div class="time-fill" id="timeFill"></div>
    </div>
      

    <div id="app">
        <div id="multi_quiz"></div>        
        <div id="answer-zone">
           <div id="result"></div>
        </div>
    </div>
  </main>

</div>
